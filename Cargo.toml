[package]
name = "wt-skin-manager"
version = "0.9.1"
authors = ["Slyvred <slyvred@proton.me>"]
edition = "2021"

[dependencies]
dioxus = { version = "0.7.10", features = [] }
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components" }
directories = "6.0.0"
futures = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["form"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = "1.53.2"
zip = "8.6.0"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
bundle = []

[profile.release]
lto = true
strip = false
debug = false
panic = "abort"
opt-level = "z"
codegen-units = 1
